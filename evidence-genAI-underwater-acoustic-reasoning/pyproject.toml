[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-reasoning"
version = "0.1.0"
description = "Reproducible evidence-grounded underwater acoustic research"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "soundfile==0.13.1",
  "matplotlib==3.9.4", "PyYAML==6.0.2", "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "requests==2.32.4", "beautifulsoup4==4.13.3", "python-docx==1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underwater_reasoning = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
