# Proposed protocol settings. No trainer is implemented by this planning commit.
schema_version: 1
project: hyperdimensional-cyber-regeneration
status: planned
device:
  required_backend: cuda
  preferred_gpu_name: NVIDIA RTX 5000 Ada Generation
  launcher: scripts/run_gpu.py
  verified_local_vram_gib: 31.48
  allow_cpu_fallback: false
  target_vram_gib: 24
  model_autocast: bfloat16_when_supported
  probability_and_loss_dtype: float32
  hdc_accumulation_dtype: float32
  record_hardware_manifest: true
  research_gpu_hours_cap: 200
  pilot_gpu_hours_cap: 4
model:
  hdc_dimension: 4096
  hdc_dimension_sweep: [2048, 4096, 8192]
  fixed_shared_codebook: true
  graph_hidden_channels: 128
  graph_layers: 3
  max_fact_slots: 512
  teacher_counterfactual_chunk_size: 32
  repair_fraction: 0.10
  repair_fraction_sweep: [0.05, 0.10, 0.25, 1.00]
  learned_gate: decision_impact
  gradient_estimator: straight_through_top_k
training:
  optimizer: adamw
  microbatch: 16
  gradient_accumulation: 4
  effective_batch: 64
  max_epochs: 100
  early_stopping_patience: 10
  seeds: [11, 23, 37, 51, 71]
  tuning_trials_per_trainable_method: 12
  learning_rate_candidates: [0.0001, 0.0003, 0.001]
  loss_coefficients: validation_selected
  gate_threshold: validation_selected
  freeze_teacher_surrogate: true
  require_cuda_readiness_check: true
dataset:
  pilot_train_episodes: 2000
  target_train_episodes: 20000
  target_validation_episodes: 2000
  target_test_episodes: 4000
  max_episode_steps: 64
  train_host_sizes: [16, 32, 64]
  extrapolation_host_sizes: [96]
  split_unit: topology_family_and_seed
  split_adjacent_windows: false
  hidden_truth_at_inference: false
  corruption_masks_at_inference: false
  observer_count: 3
  authenticated_report_origin: true
planner:
  common_across_methods: true
  max_candidates: 32
  max_steps_per_candidate: 8
  top_k: 3
  reference: best_ground_truth_candidate_in_common_set
  base_action_effects: deterministic
conditions:
  corruption_fraction: [0.0, 0.1, 0.2, 0.4]
  observation_missing_fraction: [0.0, 0.2, 0.5]
  corruption_families:
    - random_replacement
    - targeted_prerequisite
    - coherent_correlated
  include_benign_state_changes: true
  include_zero_independent_evidence: true
  include_joint_repair_interactions: true
  bytes_per_observer_round: [0, 512, 2048, 8192]
  link_loss_fraction: [0.0, 0.25, 0.5]
  outage_burst_steps: [0, 4, 16]
  design: frozen_reference_plus_one_factor_sweeps_and_declared_interactions
comparisons:
  required:
    - B0_probabilistic_symbolic
    - B1_graphmae_adapted
    - B2_graphmae_decision_aware
    - B3_hdc_cleanup
    - B4_full_regeneration
    - B5_entropy_gate
    - P_decision_impact_hdc
  mandatory_ablations:
    - random_gate
    - no_provenance
    - no_semantic_term
    - dense_with_proposed_gate_and_objective
evaluation:
  primary: feasible_coa_recall_at_3
  primary_comparison: P_vs_B2
  paired_episodes: true
  confidence_level: 0.95
  bootstrap_units: [training_seed, topology_cluster]
  latency_batch_sizes: [1, 16]
  report_median_and_p95: true
  serialize_before_counting_bytes: true
  include_ledger_memory: true
  include_host_time: true
figures:
  planned_paper_figures: 6
  minimum_empirical_figures: 4
  required_empirical_figures: [2, 3, 4, 5]
  require_provenance_sidecar: true
