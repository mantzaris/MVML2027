<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="62" font-size="34" fill="#17283f" font-weight="bold" text-anchor="start">Selective regeneration for cyber planning</text><text x="48" y="103" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">Partial evidence becomes a budgeted belief repair and an inspectable course of action.</text><text x="48" y="1060" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">MVML 2027  |  HYPER-CAP research design  |  Schematic only — no measured results</text><rect x="48" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">A</text><text x="122" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Distributed evidence</text><rect x="76" y="238" width="204" height="123" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="92" y="270" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Observer 1</text><text x="92" y="302" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Host status</text><text x="92" y="328" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Local history</text><line x1="178" y1="363" x2="178" y2="405" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="308" y="238" width="204" height="123" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="324" y="270" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Observer 2</text><text x="324" y="302" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Service checks</text><text x="324" y="328" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Delayed reports</text><line x1="410" y1="363" x2="410" y2="405" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="238" width="204" height="123" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="556" y="270" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Observer 3</text><text x="556" y="302" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Mission limits</text><text x="556" y="328" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Resource evidence</text><line x1="642" y1="363" x2="642" y2="405" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="91" y="414" width="641" height="103" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="107" y="446" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">Provenance-preserving exchange</text><text x="107" y="478" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Origin IDs · time windows · bounded serialized bytes</text><text x="88" y="542" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">No observer receives the complete hidden state.</text><rect x="824" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">B</text><text x="898" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">GPU representation and learning</text><rect x="852" y="242" width="204" height="136" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="868" y="274" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">HDC memory</text><text x="868" y="306" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Fixed codebook</text><text x="868" y="332" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Batched retrieval</text><rect x="1086" y="242" width="204" height="136" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="1102" y="274" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">Graph network</text><text x="1102" y="306" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Dependencies</text><text x="1102" y="332" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Belief decoder</text><rect x="1320" y="242" width="204" height="136" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="1336" y="274" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">Repair gate</text><text x="1336" y="306" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Learned impact</text><text x="1336" y="332" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Select up to K</text><line x1="1058" y1="308" x2="1081" y2="308" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1292" y1="308" x2="1315" y2="308" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="852" y="416" width="672" height="99" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="868" y="448" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">CUDA execution</text><text x="868" y="480" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Mixed-precision layers · FP32 beliefs and losses</text><text x="852" y="542" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Training and learned inference require a usable GPU.</text><rect x="48" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">C</text><text x="122" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Selective regeneration</text><re