troke="#087f8c" stroke-width="2"/><rect x="374" y="787" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="445" y="787" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="516" y="787" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="587" y="787" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="90" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="161" y="832" width="54" height="31" rx="6" fill="#b87b13" stroke="#b87b13" stroke-width="2"/><rect x="232" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="303" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="374" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="445" y="832" width="54" height="31" rx="6" fill="#586b82" stroke="#586b82" stroke-width="2"/><rect x="516" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="587" y="832" width="54" height="31" rx="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="673" y="697" width="69" height="166" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="689" y="729" font-size="22" fill="#b87b13" font-weight="bold" text-anchor="start">K</text><text x="689" y="761" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">cap</text><rect x="90" y="900" width="18" height="18" rx="4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="117" y="916" font-size="19" fill="#087f8c" font-weight="normal" text-anchor="start">Retain</text><rect x="280" y="900" width="18" height="18" rx="4" fill="#b87b13" stroke="#b87b13" stroke-width="2"/><text x="307" y="916" font-size="19" fill="#b87b13" font-weight="normal" text-anchor="start">Regenerate</text><rect x="523" y="900" width="18" height="18" rx="4" fill="#586b82" stroke="#586b82" stroke-width="2"/><text x="550" y="916" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Unresolved</text><text x="90" y="968" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Recompute affected dependencies; keep competing beliefs.</text><rect x="824" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">D</text><text x="898" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Shared planner and audit trace</text><rect x="851" y="703" width="173" height="100" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="867" y="735" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">Evidence</text><text x="867" y="767" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Source and age</text><rect x="1072" y="703" width="194" height="100" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="1088" y="735" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">Prerequisite</text><text x="1088" y="767" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Belief + rule</text><rect x="1313" y="677" width="211" height="88" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="1329" y="709" font-size="20" fill="#b87b13" font-weight="bold" text-anchor="start">COA A</text><text x="1329" y="741" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Conditional plan</text><rect x="1313" y="830" width="211" height="88" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="1329" y="862" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">COA B</text><text x="1329" y="894" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Alternative plan</text><line x1="1026" y1="750" x2="1067" y2="750" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1268" y1="745" x2="1309" y2="724" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1242" y1="805" x2="1309" y2="860" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><text x="852" y="877" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">Same generator and planner</text><text x="852" y="905" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">for every comparison method.</text><text x="852" y="970" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Report top-three feasibility, utility, diversity, and assumptions.</text></g></svg>