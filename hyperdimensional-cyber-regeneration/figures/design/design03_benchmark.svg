<text x="48" y="62" font-size="34" fill="#17283f" font-weight="bold" text-anchor="start">A benchmark that separates deception from change</text><text x="48" y="103" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">Hidden-state evaluation and topology-disjoint splits protect the scientific comparison.</text><text x="48" y="1060" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">MVML 2027  |  HYPER-CAP research design  |  Schematic only — no measured results</text><rect x="48" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">A</text><text x="122" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Synthetic service-dependency world</text><line x1="166" y1="299" x2="364" y2="260" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="166" y1="299" x2="364" y2="401" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="364" y1="260" x2="596" y2="326" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="364" y1="401" x2="596" y2="326" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="144" cy="300" r="38" fill="white" stroke="#355bd6" stroke-width="3"/><text x="144" y="307" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="middle">Net</text><circle cx="366" cy="249" r="38" fill="white" stroke="#087f8c" stroke-width="3"/><text x="366" y="256" font-size="18" fill="#087f8c" font-weight="bold" text-anchor="middle">Auth</text><circle cx="366" cy="420" r="38" fill="white" stroke="#b87b13" stroke-width="3"/><text x="366" y="427" font-size="18" fill="#b87b13" font-weight="bold" text-anchor="middle">Data</text><circle cx="622" cy="325" r="38" fill="white" stroke="#355bd6" stroke-width="3"/><text x="622" y="332" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="middle">Svc</text><text x="83" y="496" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Known action schema; hidden readiness and resource facts.</text><text x="83" y="532" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Deterministic base actions support exact rollout checks.</text><rect x="824" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">B</text><text x="898" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Partial and conflicting observations</text><text x="856" y="272" font-size="20" fill="#17283f" font-weight="bold" text-anchor="start">Observer 1</text><rect x="1015" y="249" width="46" height="32" rx="5" fill="#d7e0ec" stroke="#d7e0ec" stroke-width="2"/><rect x="1077" y="249" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="1139" y="249" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="1201" y="249" width="46" height="32" rx="5" fill="#d7e0ec" stroke="#d7e0ec" stroke-width="2"/><rect x="1263" y="249" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="1325" y="249" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="1387" y="249" width="46" height="32" rx="5" fill="#d7e0ec" stroke="#d7e0ec" stroke-width="2"/><rect x="1449" y="249" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="856" y="348" font-size="20" fill="#17283f" font-weight="bold" text-anchor="start">Observer 2</text><rect x="1015" y="325" width="46" height="32" rx="5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="1077" y=