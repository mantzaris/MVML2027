ll="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">C</text><text x="122" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Controlled perturbation families</text><rect x="79" y="687" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="95" y="719" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">Random reports</text><text x="95" y="749" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Matched corruption count</text><rect x="422" y="687" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#ba4b43" stroke-width="2"/><text x="438" y="719" font-size="20" fill="#ba4b43" font-weight="bold" text-anchor="start">Critical prerequisite</text><text x="438" y="749" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Targeted decision impact</text><rect x="79" y="781" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#ba4b43" stroke-width="2"/><text x="95" y="813" font-size="20" fill="#ba4b43" font-weight="bold" text-anchor="start">Coherent falsehood</text><text x="95" y="843" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Local rules still satisfied</text><rect x="422" y="781" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="438" y="813" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">Genuine change</text><text x="438" y="843" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Truth changes; no deception</text><rect x="79" y="875" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="95" y="907" font-size="20" fill="#b87b13" font-weight="bold" text-anchor="start">Link outage</text><text x="95" y="937" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Missing or delayed exchange</text><rect x="422" y="875" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="438" y="907" font-size="20" fill="#b87b13" font-weight="bold" text-anchor="start">Joint repairs</text><text x="438" y="937" font-size="17" fill="#586b82" font-weight="normal" text-anchor="start">Two corrections needed</text><text x="79" y="990" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Freeze reference conditions before inspecting test outcomes.</text><rect x="824" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">D</text><text x="898" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Splits and information access</text><rect x="854" y="691" width="204" height="99" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="870" y="723" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Train</text><text x="870" y="755" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Fit and supervise</text><rect x="1087" y="691" width="204" height="99" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="1103" y="723" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">Validation</text><text x="1103" y="755" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Tune and calibrate</text><rect x="1320" y="691" width="204" height="99" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="1336" y="723" font-size="21" fill="#b87b13" font-weight="bold" text-anchor="start">Test</text><text x="1336" y="755" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Score once frozen</text><text x="854" y="836" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Disjoint topology families, episodes, and generator seeds.</text><rect x="854" y="869" width="670" height="96" rx="14" fill="#f4f7fb" stroke="#ba4b43" stroke-width="2" stroke-dasharray="9 6"/><text x="872" y="901" font-size="20" fill="#ba4b43" font-weight="bold" text-anchor="start">Hidden truth → training labels and evaluation metrics</text><text x="872" y="939" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">Inference input: observable history, rules, and received messages</text></g></svg>