<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>A benchmark that separates deception from change</title><desc>Hidden-state evaluation and topology-disjoint splits protect the scientific comparison.. Research design schematic, not measured results.</desc>
