y="489" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">What causes the gains</text><rect x="1197" y="428" width="322" height="80" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="1213" y="460" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">06  Generalization</text><text x="1213" y="489" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Transfer and failures</text><text x="854" y="547" font-size="18" fill="#087f8c" font-weight="bold" text-anchor="start">Figures 02–05 require real experimental measurements.</text><rect x="48" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">C</text><text x="122" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">GPU measurement contract</text><rect x="79" y="687" width="665" height="95" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="95" y="719" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">CUDA model computation</text><text x="95" y="751" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">HDC retrieval · graph layers · counterfactual batches</text><rect x="79" y="818" width="151" height="94" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="95" y="850" font-size="22" fill="#355bd6" font-weight="bold" text-anchor="start">VRAM</text><text x="95" y="882" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">All buffers</text><rect x="250" y="818" width="151" height="94" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="266" y="850" font-size="22" fill="#355bd6" font-weight="bold" text-anchor="start">p95</text><text x="266" y="882" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Batch one</text><rect x="421" y="818" width="151" height="94" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="437" y="850" font-size="22" fill="#355bd6" font-weight="bold" text-anchor="start">Bytes</text><text x="437" y="882" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Serialized</text><rect x="592" y="818" width="151" height="94" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="608" y="850" font-size="22" fill="#355bd6" font-weight="bold" text-anchor="start">GPU h</text><text x="608" y="882" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Run cost</text><text x="79" y="953" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">Report complete loop time, including symbolic planning.</text><text x="79" y="985" font-size="18" fill="#ba4b43" font-weight="normal" text-anchor="start">No silent CPU fallback for research training or inference.</text><rect x="824" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">D</text><text x="898" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Submission evidence</text><rect x="854" y="687" width="670" height="93" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="870" y="719" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">MVML 2027</text><text x="870" y="751" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Learning objective · baselines · ablations · uncertainty</text><rect x="854" y="811" width="670" height="93" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="870" y="843" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">DARPA HYPER-CAP</text><text x="870" y="875" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Alternative COAs · replanning · communication · traceability</text><text x="854" y="954" font-size="20" fill="#17283f" font-weight="bold" text-anchor="start">Plan → implementation → GPU logs → empirical figures</text><text x="854" y="986" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">A research plan alone is not prior feasibility evidence.</text></g></svg>