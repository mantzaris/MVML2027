<text x="48" y="62" font-size="34" fill="#17283f" font-weight="bold" text-anchor="start">Evidence required for the paper and the proposal</text><text x="48" y="103" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">Controlled baselines, measured GPU costs, and four mandatory empirical figures.</text><text x="48" y="1060" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">MVML 2027  |  HYPER-CAP research design  |  Schematic only — no measured results</text><rect x="48" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">A</text><text x="122" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Comparison ladder</text><rect x="78" y="230" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="255" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B0</text><text x="143" y="255" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">Probabilistic + symbolic</text><text x="440" y="255" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Conventional reference</text><rect x="78" y="273" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="298" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B1</text><text x="143" y="298" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">GraphMAE adapted</text><text x="440" y="298" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Established ML method</text><rect x="78" y="316" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="341" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B2</text><text x="143" y="341" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">GraphMAE + decision loss</text><text x="440" y="341" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Strong matched-loss control</text><rect x="78" y="359" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="384" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B3</text><text x="143" y="384" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">HDC cleanup</text><text x="440" y="384" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Representation alone</text><rect x="78" y="402" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="427" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B4</text><text x="143" y="427" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">Full regeneration</text><text x="440" y="427" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Value of selectivity</text><rect x="78" y="445" width="667" height="37" rx="5" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="470" font-size="18" fill="#355bd6" font-weight="bold" text-anchor="start">B5</text><text x="143" y="470" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">Entropy gate</text><text x="440" y="470" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Value of impact supervision</text><rect x="78" y="488" width="667" height="37" rx="5" fill="#e7f3f3" stroke="#d7e0ec" stroke-width="2"/><text x="91" y="513" font-size="18" fill="#087f8c" font-weight="bold" text-anchor="start">P</text><text x="143" y="513" font-size="17" fill="#17283f" font-weight="normal" text-anchor="start">Proposed gate + HDC</text><text x="440" y="513" font-size="16" fill="#586b82" font-weight="normal" text-anchor="start">Complete method</text><r