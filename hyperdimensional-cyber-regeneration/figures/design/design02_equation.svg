<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>A decision-impact teacher for regeneration</title><desc>The proposed extension teaches where a correction matters to downstream planning.. Research design schematic, not measured results.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#586b82"/></marker></defs>
<rect width="1600" height="1100" fill="#f4f7fb"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="62" font-size="34" fill="#17283f" font-weight="bold" text-anchor="start">A decision-impact teacher for regeneration</text><text x="48" y="103" font-size="20" fill="#586b82" font-weight="normal" text-anchor="start">The proposed extension teaches where a correction matters to downstream planning.</text><text x="48" y="1060" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">MVML 2027  |  HYPER-CAP research design  |  Schematic only — no measured results</text><rect x="48" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">A</text><text x="122" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Build on established methods</text><rect x="79" y="234" width="665" height="79" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="95" y="266" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">GraphMAE</text><text x="96" y="295" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Masked graph-feature reconstruction</text><rect x="79" y="329" width="665" height="79" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="95" y="361" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">Decision-focused learning</text><text x="96" y="390" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Prediction trained for decision quality</text><rect x="79" y="424" width="665" height="79" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="95" y="456" font-size="21" fill="#b87b13" font-weight="bold" text-anchor="start">Semantic loss</text><text x="96" y="485" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Probabilistic outputs constrained by logic</text><rect x="824" y="150" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="170" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="195" font-size="22" fill="white" font-weight="bold" text-anchor="middle">B</text><text x="898" y="196" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Counterfactual teacher at training</text><rect x="854" y="235" width="184" height="108" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="870" y="267" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Current belief</text><text x="870" y="299" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Provisional b⁻</text><rect x="1087" y="235" width="184" height="108" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="1103" y="267" font-size="21" fill="#b87b13" font-weight="bold" text-anchor="start">Repair fact f</text><text x="1103" y="299" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Training truth y</text><rect x="1320" y="235" width="204" height="108" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="1336" y="267" font-size="21" fill="#087f8c" font-weight="bold" text-anchor="start">Score plans</text><text x="1336" y="299" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Same candidates</text><line x1="1040" y1="287" x2="1083" y2="287" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1273" y1="287" x2="1316" y2="287" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="854" y="386" width="670" height="109" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="870" y="418" font-size="21" fill="#355bd6" font-weight="bold" text-anchor="start">Equation 3</text><text x="870" y="450" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Δf = [ regret(b⁻) − regret(b⁻ with f corrected) ]+</text><text x="854" y="535" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Choose up to K positive gains; truth never enters inference.</text><rect x="48" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="70" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="87" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">C</text><text x="122" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Learn the repair operator</text><rect x="79" y="688" width="290" height="104" rx="14" fill="#f4f7fb" stroke="#355bd6" stroke-width="2"/><text x="95" y="720" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">Observable evidence</text><text x="95" y="752" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">History + received messages</text><rect x="431" y="688" width="312" height="104" rx="14" fill="#f4f7fb" stroke="#087f8c" stroke-width="2"/><text x="447" y="720" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">Learned gate g</text><text x="447" y="752" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Priority scores → up to K facts</text><line x1="373" y1="738" x2="426" y2="738" stroke="#586b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="79" y="832" width="664" height="94" rx="14" fill="#f4f7fb" stroke="#b87b13" stroke-width="2"/><text x="411" y="889" font-size="29" fill="#17283f" font-weight="bold" text-anchor="middle">bᵍ = (1 − g) ⊙ b⁻ + g ⊙ r</text><text x="79" y="969" font-size="19" fill="#586b82" font-weight="normal" text-anchor="start">r is the regenerated belief; g limits which facts change.</text><rect x="824" y="600" width="728" height="410" rx="14" fill="white" stroke="#d7e0ec" stroke-width="2"/><rect x="846" y="620" width="35" height="35" rx="8" fill="#355bd6" stroke="#355bd6" stroke-width="2"/><text x="863" y="645" font-size="22" fill="white" font-weight="bold" text-anchor="middle">D</text><text x="898" y="646" font-size="24" fill="#17283f" font-weight="bold" text-anchor="start">Checks and failure boundaries</text><rect x="854" y="691" width="670" height="55" rx="9" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="870" y="726" font-size="20" fill="#355bd6" font-weight="bold" text-anchor="start">K = 0</text><text x="1140" y="726" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Retain the provisional state</text><rect x="854" y="762" width="670" height="55" rx="9" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="870" y="797" font-size="20" fill="#087f8c" font-weight="bold" text-anchor="start">All facts selected</text><text x="1140" y="797" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Recover full reconstruction</text><rect x="854" y="833" width="670" height="55" rx="9" fill="#f4f7fb" stroke="#d7e0ec" stroke-width="2"/><text x="870" y="868" font-size="20" fill="#b87b13" font-weight="bold" text-anchor="start">Entropy-only gate</text><text x="1140" y="868" font-size="18" fill="#17283f" font-weight="normal" text-anchor="start">Comparator at the same budget</text><text x="854" y="942" font-size="20" fill="#ba4b43" font-weight="bold" text-anchor="start">One-fact gains can miss interacting repairs.</text><text x="854" y="975" font-size="18" fill="#586b82" font-weight="normal" text-anchor="start">Evaluate paired-repair cases and irreducible ambiguity.</text></g></svg>